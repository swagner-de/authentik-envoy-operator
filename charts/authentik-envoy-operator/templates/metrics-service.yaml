{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "authentik-envoy-operator.fullname" . }}-metrics
  labels:
    {{- include "authentik-envoy-operator.labels" . | nindent 4 }}
spec:
  ports:
    - port: 8080
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "authentik-envoy-operator.selectorLabels" . | nindent 4 }}
{{- end }}
