# This rule is not used by the project authentik-envoy-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to authentik-envoy-operator.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: authentik-envoy-operator
    app.kubernetes.io/managed-by: kustomize
  name: oidcapplication-viewer-role
rules:
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - oidcapplications
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - oidcapplications/status
  verbs:
  - get
