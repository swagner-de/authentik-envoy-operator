# This rule is not used by the project authentik-envoy-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the authentik-envoy-operator.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: authentik-envoy-operator
    app.kubernetes.io/managed-by: kustomize
  name: oidcapplication-editor-role
rules:
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - oidcapplications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - oidcapplications/status
  verbs:
  - get
