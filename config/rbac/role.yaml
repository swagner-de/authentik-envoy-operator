---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - authentikproviders
  - oidcpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - authentikproviders/finalizers
  - oidcpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - authentikproviders/status
  - oidcpolicies/status
  verbs:
  - get
  - patch
  - update
