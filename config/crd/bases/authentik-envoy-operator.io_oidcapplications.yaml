---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: oidcapplications.authentik-envoy-operator.io
spec:
  group: authentik-envoy-operator.io
  names:
    kind: OIDCApplication
    listKind: OIDCApplicationList
    plural: oidcapplications
    singular: oidcapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OIDCApplication provisions an Authentik OAuth2 application, optionally
          fronted by Envoy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OIDCApplicationSpec defines an Authentik application, optionally
              fronted by Envoy.
            properties:
              accessCodeValidity:
                type: string
              accessTokenValidity:
                type: string
              appMeta:
                description: AppMeta holds Authentik application launcher metadata
                  (passthrough).
                properties:
                  description:
                    type: string
                  group:
                    type: string
                  icon:
                    type: string
                  launchURL:
                    type: string
                  openInNewTab:
                    type: boolean
                  publisher:
                    type: string
                type: object
              cookieConfig:
                description: CookieConfig defines cookie settings for the Envoy OIDC
                  session.
                properties:
                  domain:
                    type: string
                  namePrefix:
                    type: string
                  sameSite:
                    default: Lax
                    enum:
                    - Lax
                    - Strict
                    - None
                    type: string
                type: object
              displayName:
                description: DisplayName is the Authentik application name. Defaults
                  to metadata.name.
                type: string
              forwardAccessToken:
                default: true
                type: boolean
              groups:
                items:
                  description: |-
                    GroupRef is a group to bind to the application. create=false requires it to
                    already exist; create=true creates it if missing. cleanup=true deletes it on
                    OIDCApplication deletion, but only if the operator created it.
                  properties:
                    cleanup:
                      default: false
                      type: boolean
                    create:
                      default: false
                      type: boolean
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              includeClaimsInIDToken:
                default: true
                type: boolean
              propertyMappings:
                items:
                  type: string
                type: array
              providerRef:
                description: ProviderRef references a cluster-scoped AuthentikProvider.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              redirectURIs:
                items:
                  type: string
                type: array
              refreshTokenValidity:
                type: string
              scopes:
                default:
                - openid
                - profile
                items:
                  type: string
                type: array
              secretName:
                description: |-
                  SecretName overrides the application Secret name. It is used only when
                  SecretTemplate contains entries and defaults to "<metadata.name>-oidc".
                type: string
              secretTemplate:
                additionalProperties:
                  type: string
                description: |-
                  SecretTemplate maps Secret data keys to Go templates rendered from the OIDC
                  provider credentials and discovery document.
                type: object
                x-kubernetes-validations:
                - message: keys must be valid Kubernetes Secret data keys
                  rule: self.all(k, k.size() <= 253 && k.matches('^[-._a-zA-Z0-9]+$'))
              signingKey:
                minLength: 1
                type: string
              slug:
                description: |-
                  Slug is the stable identifier (Authentik slug, client_id, provider name).
                  Defaults to "<namespace>-<name>". Immutable.
                maxLength: 50
                pattern: ^[-a-zA-Z0-9_]+$
                type: string
              subMode:
                description: Provider tuning (optional passthrough).
                type: string
              targetRefs:
                description: TargetRefs are Gateway API routes to protect. Empty ⇒
                  standalone (no SecurityPolicy).
                items:
                  description: TargetRef identifies a Gateway API route to protect
                    with a SecurityPolicy.
                  properties:
                    group:
                      default: gateway.networking.k8s.io
                      type: string
                    kind:
                      default: HTTPRoute
                      type: string
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
            required:
            - groups
            - providerRef
            - signingKey
            type: object
          status:
            description: OIDCApplicationStatus defines the observed state.
            properties:
              authentik:
                description: AuthentikStatus tracks created Authentik resources.
                properties:
                  applicationID:
                    type: string
                  applicationSlug:
                    type: string
                  boundGroups:
                    items:
                      type: string
                    type: array
                  clientID:
                    type: string
                  createdGroups:
                    description: CreatedGroups are groups the operator created (candidates
                      for cleanup).
                    items:
                      type: string
                    type: array
                  policyBindingIDs:
                    items:
                      type: string
                    type: array
                  providerID:
                    type: integer
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              secretName:
                type: string
              securityPolicies:
                items:
                  description: SecurityPolicyRef tracks a created SecurityPolicy.
                  properties:
                    name:
                      type: string
                    targetRoute:
                      type: string
                  required:
                  - name
                  - targetRoute
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
