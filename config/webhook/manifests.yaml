---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-authentik-envoy-operator-io-v1alpha1-oidcpolicy
  failurePolicy: Fail
  name: voidcpolicy-v1alpha1.kb.io
  rules:
  - apiGroups:
    - authentik-envoy-operator.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - oidcpolicies
  sideEffects: None
