apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "authentik-envoy-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - authentikproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - authentikproviders/status
  - oidcapplications/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - oidcapplications
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik-envoy-operator.io
  resources:
  - oidcapplications/finalizers
  verbs:
  - update
- apiGroups:
  - gateway.envoyproxy.io
  resources:
  - securitypolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - get
  - list
  - watch
