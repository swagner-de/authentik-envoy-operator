  name: authentik-envoy-operator-webhook-service
  namespace: authentik-envoy-operator-system
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app.kubernetes.io/name: authentik-envoy-operator
